<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add to JeNieCast</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="logo"><span class="logo-accent">J</span>e<span class="logo-accent">N</span>ieCast</a>

      <div id="authArea" class="auth-area"></div>
    </nav>
  </header>

  <main class="page add-page">
    <section class="page-header">
      <h1>Add something to watch</h1>
      <p>Save a movie, show, YouTube video, anime, documentary, or even something you forgot the name of.</p>
      <div class="page-header-actions">
        <a href="dashboard.html" class="btn secondary-btn">Back to dashboard</a>
      </div>
    </section>

    <form id="addWatchForm" class="form">
      <div class="form-group">
        <label for="title">Title</label>
        <input id="title" type="text" placeholder="Example: The Office" required />
      </div>

      <div class="form-group">
        <label for="type">Type</label>
        <select id="type" required></select>
      </div>

      <div class="form-group">
        <label for="platform">Platform</label>
        <input id="platform" type="text" placeholder="Netflix, YouTube, TikTok, Prime Video..." required />
      </div>

      <div class="form-group">
        <label for="moods">Mood tags</label>
        <input id="moods" type="text" placeholder="Eating, Funny, Comfort" required />
      </div>

      <div class="form-group">
        <label for="status">Status</label>
        <select id="status" required></select>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Why did you save this? Where did you see it?"></textarea>
      </div>

      <p id="addFormMessage" class="form-message error" role="status" hidden></p>

      <button type="submit" class="btn primary-btn full-width">Save to JeNieCast</button>
    </form>
  </main>

  <script type="module" src="js/add.js"></script>
</body>
</html>
