<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JeNieCast Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="logo"><span class="logo-accent">J</span>e<span class="logo-accent">N</span>ieCast</a>

      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="add.html">Add Watch</a>
      </div>
    </nav>
  </header>

  <main class="page">
    <section class="page-header">
      <h1>Your watch dashboard</h1>
      <p>Filter your saved movies, shows, videos, and comfort rewatches by mood.</p>
    </section>

    <section class="filter-row">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Eating">Eating</button>
      <button class="filter-btn" data-filter="Funny">Funny</button>
      <button class="filter-btn" data-filter="Comfort">Comfort</button>
      <button class="filter-btn" data-filter="Action">Action</button>
      <button class="filter-btn" data-filter="Need to Identify">Need to Identify</button>
    </section>

    <form id="editWatchForm" class="form edit-form" hidden>
      <h2>Edit watch item</h2>

      <div class="form-group">
        <label for="editTitle">Title</label>
        <input id="editTitle" type="text" required />
      </div>

      <div class="form-group">
        <label for="editType">Type</label>
        <select id="editType" required></select>
      </div>

      <div class="form-group">
        <label for="editPlatform">Platform</label>
        <input id="editPlatform" type="text" required />
      </div>

      <div class="form-group">
        <label for="editMoods">Mood tags</label>
        <input id="editMoods" type="text" required />
      </div>

      <div class="form-group">
        <label for="editStatus">Status</label>
        <select id="editStatus" required></select>
      </div>

      <div class="form-group">
        <label for="editNotes">Notes</label>
        <textarea id="editNotes"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn primary-btn">Save Changes</button>
        <button id="cancelEditBtn" type="button" class="btn secondary-btn">Cancel</button>
      </div>
    </form>

    <section id="watchGrid" class="grid"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
