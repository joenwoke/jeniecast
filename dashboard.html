<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JeNieCast Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav">
      <a href="index.html" class="logo"><span class="logo-accent">J</span>e<span class="logo-accent">N</span>ieCast</a>

      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="add.html">Add Watch</a>
      </div>
    </nav>
  </header>

  <main class="page">
    <section class="page-header">
      <h1>Your watch dashboard</h1>
      <p>Filter your saved movies, shows, videos, and comfort rewatches by mood.</p>
    </section>

    <section id="dashboardStats" class="stats-row" aria-label="Watchlist stats"></section>

    <section id="filterRow" class="filter-row"></section>

    <div class="dashboard-controls">
      <div class="search-row">
        <label for="dashboardSearch">Search watchlist</label>
        <div class="search-control">
          <input id="dashboardSearch" type="search" placeholder="Search title, platform, mood, status, or notes..." />
          <button id="clearSearchBtn" class="clear-search-btn" type="button" hidden>Clear</button>
        </div>
      </div>

      <div class="sort-row">
        <label for="dashboardSort">Sort by</label>
        <select id="dashboardSort">
          <option value="recent">Recently added</option>
          <option value="title">Title A-Z</option>
          <option value="type">Type</option>
          <option value="status">Status</option>
          <option value="platform">Platform</option>
        </select>
      </div>

      <div class="backup-row">
        <span>Backup</span>
        <div class="backup-actions">
          <button id="exportWatchlistBtn" class="backup-btn" type="button">Export JSON</button>
          <button id="importWatchlistBtn" class="backup-btn" type="button">Import JSON</button>
          <input id="importWatchlistInput" type="file" accept="application/json,.json" hidden />
        </div>
        <p id="backupMessage" class="backup-message" role="status" hidden></p>
      </div>
    </div>

    <form id="editWatchForm" class="form edit-form" hidden>
      <h2>Edit watch item</h2>

      <div class="form-group">
        <label for="editTitle">Title</label>
        <input id="editTitle" type="text" required />
      </div>

      <div class="form-group">
        <label for="editType">Type</label>
        <select id="editType" required></select>
      </div>

      <div class="form-group">
        <label for="editPlatform">Platform</label>
        <input id="editPlatform" type="text" required />
      </div>

      <div class="form-group">
        <label for="editMoods">Mood tags</label>
        <input id="editMoods" type="text" required />
      </div>

      <div class="form-group">
        <label for="editStatus">Status</label>
        <select id="editStatus" required></select>
      </div>

      <div class="form-group">
        <label for="editNotes">Notes</label>
        <textarea id="editNotes"></textarea>
      </div>

      <p id="editFormMessage" class="form-message error" role="status" hidden></p>

      <div class="form-actions">
        <button type="submit" class="btn primary-btn">Save Changes</button>
        <button id="cancelEditBtn" type="button" class="btn secondary-btn">Cancel</button>
      </div>
    </form>

    <section id="watchGrid" class="grid"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
